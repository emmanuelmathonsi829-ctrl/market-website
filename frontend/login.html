
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your Vertex Market account.">
  <title>Login | Vertex Market</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

  <header class="header page-width login-header">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">✦</span>
      Vertex Market
    </a>
    <a class="login-back-link" href="index.html">← Back to shop</a>
  </header>

  <main class="login-main">
    <section class="login-card">
      <div class="login-icon" aria-hidden="true">✦</div>

      <p class="eyebrow">WELCOME BACK</p>
      <h1>Sign <span>in.</span></h1>
      <p class="login-description">
        Enter your details to access your Vertex Market account.
      </p>

      <form id="loginForm" class="login-form">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <div class="login-options">
          <label class="remember-option" for="remember">
            <input type="checkbox" id="remember" name="remember">
            Remember me
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button class="login-submit" type="submit">
          Sign in <span aria-hidden="true">→</span>
        </button>

        <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
      </form>

      <p class="register-prompt">
        Don't have an account?
        <a href="register.html">Create account</a>
      </p>
    </section>
  </main>

  <footer class="login-footer">
    © 2026 Vertex Market. All rights reserved.
  </footer>

  <script src="js/login.js" defer></script>
</body>
</html>
