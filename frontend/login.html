
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your Vertex Market account.">
  <title>Login | Vertex Market</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="auth-container">
        <a href="index.html" class="brand">VERTEX <span>MARKET.</span></a>

        <section class="auth-card">

            <div class="auth-heading">
                <p class="eyebrow">YOUR ACCOUNT</p>
                <h1 id="formTitle">Welcome back.</h1>
                <p id="formSubtitle">
                    Sign in.
                </p>
            </div>


            <div id="message" class="message" role="status"
                 aria-live="polite" hidden></div>

            
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <div class="login-options">
          <label class="remember-option" for="remember">
            <input type="checkbox" id="remember" name="remember">
            Remember me
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button class="login-submit" type="submit">
          Sign in <span aria-hidden="true">→</span>
        </button>

        <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
      </form>

      <p class="register-prompt">
        Don't have an account?
        <a href="register.html">Create account</a>
      </p>
    </section>
  </main>

  <footer class="login-footer">
    © 2026 Vertex Market. All rights reserved.
  </footer>

  <script src="js/login.js" defer></script>
</body>
</html>
